<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qmetify</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='14' width='5' height='5' fill='%239C3A55'/><rect x='9' y='9' width='5' height='5' fill='%236F7A76'/><rect x='9' y='16' width='5' height='5' fill='%236F7A76'/><rect x='16' y='9' width='5' height='5' fill='%236F7A76'/><rect x='16' y='16' width='5' height='5' fill='%236F7A76'/><rect x='23' y='14' width='5' height='5' fill='%232E6B5C'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EC; --surface:#F9FBF8; --ink:#1E2A28; --muted:#5B6864; --line:#C7D0CB;
  --agree:#2E6B5C; --agree-soft:#DCEBE5; --dis:#9C3A55; --dis-soft:#F2E0E6;
  --neu:#9A6B12; --neu-soft:#F4EAD3; --pick:#C9921B; --pick-soft:#F6E9C8;
  --err:#A3302C; --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131B1A; --surface:#1B2523; --ink:#E3EAE7; --muted:#9BA9A4; --line:#34433F;
  --agree:#72B8A4; --agree-soft:#1E3831; --dis:#DA869D; --dis-soft:#3C2430;
  --neu:#D9AE5B; --neu-soft:#3A301C; --pick:#E6BD55; --pick-soft:#3A3118; --err:#F08A84;
}}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(30px,4.5vw,44px)} h2{font-size:28px} h3{font-size:20px}
p{margin:0 0 1em;max-width:70ch}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
.narrow{max-width:720px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:21px;font-weight:600;background:none;border:0;color:inherit;cursor:pointer;padding:0;text-align:left}
.brand svg{flex:none}
.bar-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:15px;padding:10px 18px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;line-height:1.2}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{font-size:13.5px;padding:6px 11px}
.btn.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--pick);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:5px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:32px;flex-wrap:wrap}
.banner{background:var(--pick-soft);border-bottom:1px solid var(--pick);padding:9px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;flex-wrap:wrap}

/* stepper */
.steps{display:flex;gap:18px;list-style:none;margin:0;padding:0;font-size:13.5px;color:var(--muted);counter-reset:s}
.steps li{counter-increment:s;display:flex;align-items:center;gap:6px}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);font-size:11.5px;font-weight:600}
.steps li.on{color:var(--ink);font-weight:600}
.steps li.on::before{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps li.done::before{content:"✓";border-color:var(--agree);color:var(--agree)}

/* home */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding:36px 0 44px}
.hero h1{font-size:clamp(44px,7vw,76px);letter-spacing:-.01em;margin-bottom:.25em}
.hero .lead{font-family:var(--serif);font-size:22px;line-height:1.45;max-width:30ch}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 14px}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;border-top:1px solid var(--line);padding-top:28px}
.feat h3{font-size:19px;margin-bottom:.3em}
.feat p{font-size:15px;color:var(--muted)}
.pyr{display:flex;gap:6px;justify-content:center;align-items:flex-start}
.pyr .pc{display:flex;flex-direction:column;gap:6px;align-items:center}
.pyr .pl{font-family:var(--serif);font-size:18px;margin-bottom:2px}
.pyr .pb{width:clamp(26px,4.2vw,46px);height:clamp(18px,2.8vw,30px);border-radius:3px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c)}
@media (prefers-reduced-motion:no-preference){
  .pyr.anim .pb{animation:drop .55s cubic-bezier(.2,.8,.25,1) both;animation-delay:var(--d)}
  @keyframes drop{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}
}

/* participant */
.ptitle{margin-top:8px}
.text-block p{font-size:17px}
.consent{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-top:22px}
.consent p{font-size:15px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;cursor:pointer}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--agree);flex:none}
.coi{font-family:var(--serif);font-size:22px;line-height:1.4;margin:6px 0 18px;max-width:60ch}
.coi-small{font-family:var(--serif);font-size:18px;line-height:1.4;margin:0 0 6px}
.howlist{padding-left:22px;margin:0 0 24px}
.howlist li{margin-bottom:10px;max-width:68ch;font-size:16.5px}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:10px 0 0}
.progress span{display:block;height:100%;background:var(--ink);transition:width .25s}
.pcard{max-width:680px;margin:26px auto 22px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:40px 38px;font-family:var(--serif);font-size:clamp(20px,2.6vw,25px);line-height:1.45;min-height:190px;display:flex;align-items:center;box-shadow:0 18px 30px -24px rgba(20,35,32,.45)}
.piles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:680px;margin:0 auto}
.pilebtn{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:5px;padding:14px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:92px}
.pilebtn:hover{border-color:var(--c)}
.pilebtn[aria-pressed="true"]{background:var(--cs)}
.pilebtn .pn{font-weight:600;font-size:15.5px;line-height:1.25}
.pilebtn .pk{font-size:12.5px;color:var(--muted);margin-top:auto;display:flex;justify-content:space-between}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 6px;font-size:12px;font-weight:600;color:var(--ink)}
.center-row{max-width:680px;margin:14px auto 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* sort grid (compact, fits one screen) */
.sortwrap{max-width:1500px;padding:12px 20px 12px}
.sorttop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:stretch;margin-bottom:6px}
.stmain{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c,var(--ink));border-radius:0 8px 8px 0;padding:9px 16px;min-height:72px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
.coi-top{font-family:var(--serif);font-size:clamp(19px,1.7vw,24px);line-height:1.3;color:var(--ink);margin:0 0 8px;max-width:none;font-weight:600}
.hint-mini .btn.link{font-size:13.5px;padding:0;vertical-align:baseline}
.hint-mini .helptxt{color:var(--ink)}
.cur{display:flex;gap:12px;align-items:baseline;min-width:0}
.cur[draggable="true"]{cursor:grab}
.cur .pbadge{flex:none;font-size:12.5px;font-weight:700;color:var(--c);border:1.5px solid var(--c);border-radius:4px;padding:1px 8px;white-space:nowrap}
.cur .ctx{font-family:var(--serif);font-size:clamp(17px,1.55vw,21px);line-height:1.35}
.cur.issel .pbadge{color:var(--ink);background:var(--pick-soft);border-color:var(--pick)}
.cur.alldone .ctx{color:var(--agree);font-weight:600}
.stbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:center}
.stbtns .btn{white-space:nowrap;font-size:13.5px;padding:7px 12px}
.hint-mini{display:flex;align-items:center;gap:14px;margin:2px 0 10px;max-width:none;line-height:1.4}
.leftpill{flex:none;font-size:17px;font-weight:700;color:var(--bg);background:var(--ink);border-radius:999px;padding:5px 14px;white-space:nowrap}
.leftpill.done{background:var(--agree)}
.howto{font-size:clamp(15px,1.25vw,17px);color:var(--ink);line-height:1.35}
@media (max-width:700px){.hint-mini{flex-direction:column;align-items:flex-start;gap:6px}}
.hint-mini strong{color:var(--ink)}
.gridwrap{overflow-x:auto;padding:2px 2px 0}
.qgrid{display:grid;grid-template-columns:repeat(var(--k,9),minmax(var(--mincw,0px),1fr));gap:6px;align-items:start}
.qcol{display:flex;flex-direction:column;gap:4px;min-width:0}
.qhead{font:inherit;background:none;border:0;border-bottom:3px solid var(--c);color:var(--c);padding:0 0 3px;cursor:pointer;display:flex;justify-content:center;align-items:baseline;gap:6px;border-radius:0}
.qhead .sc{font-family:var(--serif);font-size:22px;line-height:1.1;font-weight:600}
.qhead .cnt{font-size:12px;color:var(--muted);font-weight:600}
.qhead .cnt.full{color:var(--c)}
.qhead:hover,.picking .qhead{background:color-mix(in srgb,var(--cs) 70%,transparent)}
.qhead.over{background:var(--pick-soft)}
.slot{height:var(--sh,40px);border:1.5px dashed color-mix(in srgb,var(--c) 55%,var(--line));background:color-mix(in srgb,var(--cs) 40%,transparent);border-radius:4px;padding:0;font:inherit;color:inherit;cursor:pointer;width:100%;display:block;min-width:0}
.slot.filled{border:0;background:none}
.slot.empty:hover,.picking .slot.empty{border-color:var(--pick);border-style:solid}
.slot.over{background:var(--pick-soft);border-style:solid;border-color:var(--pick)}
.scard{font:inherit;display:block;width:100%;height:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid color-mix(in srgb,var(--c) 55%,var(--line));border-left:4px solid var(--c);border-radius:0 4px 4px 0;padding:2px 7px;font-family:var(--sans);font-size:12.5px;line-height:1.22;cursor:pointer;overflow:hidden}
.scard .tx{display:-webkit-box;-webkit-line-clamp:var(--lc,2);-webkit-box-orient:vertical;overflow:hidden}
.scard .num{font-weight:700;color:var(--c);margin-right:4px}
.scard:hover{border-color:var(--c)}
.scard.sel{outline:3px solid var(--pick);outline-offset:-1px;background:var(--pick-soft)}
.ends{display:flex;justify-content:space-between;gap:20px;margin:5px 0 0;font-weight:600;font-size:13.5px}
.ends .l{color:var(--dis)} .ends .r{color:var(--agree)}
.sortfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;font-weight:600;z-index:50}
.narrow-note{display:none}
@media (max-width:700px){.narrow-note{display:block}.qgrid{--mincw:92px}.sorttop{grid-template-columns:minmax(0,1fr)}.stbtns{grid-template-columns:1fr 1fr}.stbtns .btn{white-space:normal}.cur{flex-direction:column;gap:6px}.sortwrap{padding:10px 12px}}

/* post */
.ext{margin:22px 0}
.ext h3{display:flex;align-items:center;gap:10px}
.ext h3 .badge{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--c);border:1.5px solid var(--c);border-radius:4px;padding:1px 7px}
.cm{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:5px;padding:14px 16px;margin-bottom:12px}
.cm .q{font-family:var(--serif);font-size:17px;margin:0 0 10px;line-height:1.4}
.cm .q .sc{font-family:var(--sans);font-weight:700;font-size:13px;color:var(--c);margin-right:6px}
input[type=text],input[type=url],input[type=number],textarea,select{font:inherit;font-size:15px;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}
textarea{resize:vertical;min-height:64px;line-height:1.45}
.invalid{border-color:var(--err)!important;box-shadow:0 0 0 1px var(--err)}
.err{color:var(--err);font-weight:600;font-size:14.5px}
.qfield{margin-bottom:18px;max-width:640px}
.qfield label.lb{display:block;font-weight:600;margin-bottom:6px}
.done-mark{width:64px;height:64px;margin-bottom:16px}

/* designer */
.dz{display:grid;grid-template-columns:230px 1fr;gap:36px;align-items:start}
.dnav{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px}
.dnav button{font:inherit;text-align:left;background:transparent;border:0;border-left:3px solid transparent;padding:9px 12px;color:var(--muted);font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dnav button[aria-current="true"]{color:var(--ink);border-left-color:var(--ink);background:var(--surface)}
.dnav .flag{font-size:11.5px;font-weight:700;border-radius:10px;padding:0 7px;line-height:18px}
.flag.e{background:var(--dis-soft);color:var(--dis)} .flag.w{background:var(--pick-soft);color:var(--ink)} .flag.n{color:var(--muted);font-weight:600}
.dpanel h2{margin-bottom:.2em}
.dpanel>.intro{color:var(--muted);margin-bottom:26px;max-width:68ch}
.field{margin-bottom:22px;max-width:760px}
.field>label,.field>.lb{display:block;font-weight:600;font-size:14.5px;margin-bottom:4px}
.field .help{font-size:13.5px;color:var(--muted);margin:0 0 8px;max-width:68ch}
.lp{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;margin-bottom:6px}
.ltag{font-size:11.5px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);border-radius:4px;text-align:center;padding:5px 0;color:var(--muted);margin-top:4px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.strow{display:grid;grid-template-columns:62px 1fr auto;gap:12px;padding:14px 0;border-top:1px solid var(--line);max-width:900px}
.sid{font-weight:700;font-size:14px;padding-top:8px}
.sacts{display:flex;flex-direction:column;gap:4px}
.icon-btn{font:inherit;font-size:13px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:3px 8px;cursor:pointer;min-width:34px}
.icon-btn:hover{color:var(--ink);border-color:var(--ink)}
.cc{font-size:12px;color:var(--muted);text-align:right;margin-top:-2px}
.cc.long{color:var(--err);font-weight:600}
details.box{border:1px solid var(--line);border-radius:6px;padding:12px 16px;background:var(--surface);max-width:900px;margin-bottom:20px}
details.box summary{font-weight:600;cursor:pointer}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:6px 12px;border-radius:5px}
.status.ok{background:var(--agree-soft);color:var(--agree)} .status.bad{background:var(--dis-soft);color:var(--dis)}
.hts{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.hts label{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--serif);font-size:16px;width:56px}
.hts input{text-align:center;padding:6px 4px}
.qcard{border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px;background:var(--surface);max-width:900px}
.vlist{list-style:none;padding:0;margin:0 0 24px;max-width:760px}
.vlist li{padding:8px 0 8px 26px;border-top:1px solid var(--line);position:relative;font-size:15px}
.vlist li::before{position:absolute;left:0;top:8px;font-weight:700}
.vlist li.e::before{content:"✕";color:var(--dis)} .vlist li.w::before{content:"!";color:var(--pick)} .vlist li.o::before{content:"✓";color:var(--agree)}
.linkbox{font-family:var(--sans);font-size:13px;word-break:break-all;min-height:90px}
pre.code{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;overflow:auto;max-height:340px;font-size:12.5px;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{display:none}}
.rblock{border:1px solid var(--line);border-left:4px solid var(--agree);border-radius:0 8px 8px 0;background:var(--surface);padding:14px 18px;max-width:760px;margin-bottom:22px}
.rblock .rt{font-weight:600;font-size:15px;margin-bottom:6px}
.rblock .check{font-size:16.5px;font-weight:600}
.rblock .check input{width:22px;height:22px;margin-top:1px}
.rblock .help{font-size:14px;color:var(--muted);margin:6px 0 0 32px;max-width:66ch}
.bulkhow{font-size:14px;color:var(--muted);margin:8px 0 12px;max-width:74ch}
.bulkhow ol{margin:6px 0 6px;padding-left:22px}
.bulkhow li{margin-bottom:4px}
.gdprrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 0}
.lenmsg{display:block;margin-top:10px;font-size:14.5px;padding:8px 12px;border-radius:5px;font-weight:600;max-width:760px}
.lenmsg.ok{background:var(--agree-soft);color:var(--agree)} .lenmsg.w{background:var(--pick-soft);color:var(--ink)} .lenmsg.bad{background:var(--dis-soft);color:var(--dis)}
a.btn{text-decoration:none;display:inline-block}
.guide{margin:10px 0 4px;padding-left:22px}
.guide li{margin-bottom:8px;font-size:15px;max-width:74ch}
.guide li.w{background:var(--pick-soft);border-radius:4px;padding:4px 8px}
.guide-note{font-size:14.5px;border-left:4px solid var(--pick);background:var(--pick-soft);padding:8px 12px;border-radius:0 5px 5px 0;margin:10px 0}
.gs-notice{font-weight:600;font-size:15px;border-left:4px solid var(--pick);padding:6px 12px;margin:6px 0 12px}
.mchecks{display:flex;flex-direction:column;gap:8px}
.mchecks .check{font-weight:500}
.mchecks .oth{margin:4px 0 0 28px;max-width:420px}
.mini{display:flex;gap:clamp(4px,0.5vw,7px);align-items:flex-start;margin:16px 0;overflow-x:auto;padding-bottom:4px}
.mini .mc{display:flex;flex-direction:column;gap:clamp(3px,0.35vw,5px);align-items:center}
.mini .ml{font-family:var(--serif);font-size:clamp(14px,1.3vw,19px);color:var(--c)}
.mini .mb{width:clamp(24px,3.4vw,52px);height:clamp(14px,1.9vw,28px);border-radius:3px;background:var(--cs);border:1.5px solid var(--c)}
.hts label{font-size:clamp(16px,1.3vw,19px);width:clamp(56px,4.6vw,66px)}
@media (min-width:1280px){.dmode .bar,.dmode main{zoom:1.1}}
@media (min-width:1600px){.dmode .bar,.dmode main{zoom:1.2}}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:28px}
  .feat{grid-template-columns:1fr;gap:10px}
  .dz{grid-template-columns:1fr;gap:18px}
  .dnav{position:static;flex-direction:row;overflow-x:auto;border-bottom:1px solid var(--line)}

<script>
'use strict';
/* Qmetify: Q-módszertani felmérések tervezése és kitöltése. Egyetlen fájl, szerver nélkül. */

const LANGS = ['hu', 'en'];
const PILES = ['disagree', 'neutral', 'agree'];
const PILE_COLOR = { disagree: ['--dis', '--dis-soft'], neutral: ['--neu', '--neu-soft'], agree: ['--agree', '--agree-soft'] };
const APPS_SCRIPT = "/**\n * Qmetify: válaszgyűjtő végpont Google Táblázathoz\n * Qmetify: response collector for Google Sheets\n *\n * Telepítés / Setup:\n * 1. Hozz létre egy új Google Táblázatot. / Create a new Google Sheet.\n * 2. Bővítmények > Apps Script. Töröld a mintakódot, és másold be ezt a fájlt.\n *    Extensions > Apps Script. Replace the sample code with this file.\n * 3. Telepítés > Új telepítés > Típus: Webalkalmazás.\n *    Végrehajtás: Én. Hozzáférés: Bárki.\n *    Deploy > New deployment > Web app. Execute as: Me. Who has access: Anyone.\n * 4. A kapott /exec végű URL-t másold a tervező \"Beküldési cím\" mezőjébe.\n *    Paste the resulting /exec URL into the designer's \"Submission address\" field.\n *\n * Kódfrissítésnél: Telepítések kezelése > ceruza > Új verzió (a cím nem változik).\n * When updating the code: Manage deployments > pencil > New version (same URL).\n *\n * Felmérésenként három lap készül (a felmérés azonosítójával a nevükben):\n * Each study gets three sheets (named after the study ID):\n *   <id> · Q-sorts     sorok = állítások, oszlopok = válaszadók, utolsó oszlop: az állítás szövege\n *                      rows = statements, columns = participants, last column: statement text\n *   <id> · Comments    a szélső állítások indoklásai, soronként egy / extreme-statement comments\n *   <id> · Background  válaszadónként egy sor: idők és utólagos kérdések / one row per participant\n * A \"_raw\" lapra minden válasz teljes nyers JSON-ja is bekerül. / Full raw JSON goes to \"_raw\".\n */\n\nvar RAW_SHEET = '_raw';\nvar MAX_TEXT = 5000;\n\nfunction doGet(e) {\n  return json_({ ok: true, app: 'qmetify', time: new Date().toISOString() });\n}\n\nfunction doPost(e) {\n  var lock = LockService.getScriptLock();\n  try {\n    lock.waitLock(20000);\n  } catch (err) {\n    return json_({ ok: false, error: 'busy' });\n  }\n  try {\n    var p = JSON.parse(e.postData.contents);\n    if (!p || !p.surveyId || !p.participantId || !p.sort) {\n      return json_({ ok: false, error: 'invalid payload' });\n    }\n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n    var now = new Date();\n\n    var raw = sheet_(ss, RAW_SHEET);\n    if (raw.getLastRow() === 0) {\n      raw.appendRow(['received', 'survey_id', 'participant_id', 'json']);\n      raw.setFrozenRows(1);\n    }\n    raw.appendRow([now, safe_(p.surveyId), safe_(p.participantId), safe_(JSON.stringify(p))]);\n\n    var base = sheetName_(p.surveyId);\n    var code = writeQsorts_(ss, base, p);\n    writeComments_(ss, base, p, code, now);\n    writeBackground_(ss, base, p, code, now);\n    return json_({ ok: true, participant: code });\n  } catch (err) {\n    return json_({ ok: false, error: String(err) });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n/** Q-sort mátrix: sorok = állítások, oszlopok = válaszadók, a szöveg az utolsó oszlopban. */\nfunction writeQsorts_(ss, base, p) {\n  var sh = sheet_(ss, base + ' · Q-sorts');\n  var ids = (p.statementIds || Object.keys(p.sort)).map(String);\n  var texts = p.statementTexts || {};\n\n  if (sh.getLastRow() === 0) {\n    var init = [['statement_id', 'statement_text']];\n    ids.forEach(function (id) { init.push([id, safe_(texts[id] || '')]); });\n    sh.getRange(1, 1, init.length, 2).setValues(init);\n    sh.setFrozenRows(1);\n    sh.setFrozenColumns(1);\n  }\n\n  var lastCol = sh.getLastColumn();\n  var header = sh.getRange(1, 1, 1, lastCol).getValues()[0];\n  var textCol = header.indexOf('statement_text') + 1;\n  if (textCol < 1) {\n    textCol = lastCol + 1;\n    sh.getRange(1, textCol).setValue('statement_text');\n  }\n\n  // állítássorok: hiányzók hozzáadása, üres szövegek kitöltése\n  var rowIds = sh.getRange(1, 1, sh.getLastRow(), 1).getValues().map(function (r) { return String(r[0]); });\n  ids.forEach(function (id) {\n    if (rowIds.indexOf(id) < 0) {\n      rowIds.push(id);\n      sh.getRange(rowIds.length, 1).setValue(id);\n    }\n  });\n  var textVals = sh.getRange(1, textCol, rowIds.length, 1).getValues();\n  var changed = false;\n  for (var i = 1; i < rowIds.length; i++) {\n    if (!textVals[i][0] && texts[rowIds[i]]) { textVals[i][0] = safe_(texts[rowIds[i]]); changed = true; }\n  }\n  if (changed) sh.getRange(1, textCol, rowIds.length, 1).setValues(textVals);\n\n  // új válaszadó oszlopa a szövegoszlop elé\n  var n = textCol - 2;\n  var code = 'P' + ('00' + (n + 1)).slice(-3) + '_' + String(p.participantId).replace(/[^A-Za-z0-9]/g, '').slice(0, 6);\n  sh.insertColumnBefore(textCol);\n  var col = rowIds.map(function (id, r) {\n    if (r === 0) return [code];\n    return [p.sort.hasOwnProperty(id) ? num_(p.sort[id]) : ''];\n  });\n  sh.getRange(1, textCol, col.length, 1).setValues(col);\n  return code;\n}\n\n/** Indoklások: egy sor egy komment. */\nfunction writeComments_(ss, base, p, code, now) {\n  var sh = sheet_(ss, base + ' · Comments');\n  if (sh.getLastRow() === 0) {\n    sh.appendRow(['participant', 'received', 'statement_id', 'score', 'statement_text', 'comment']);\n    sh.setFrozenRows(1);\n  }\n  var c = p.comments || {}, texts = p.statementTexts || {};\n  Object.keys(c).forEach(function (id) {\n    sh.appendRow([code, now, safe_(id), num_(p.sort[id]), safe_(texts[id] || ''), safe_(c[id])]);\n  });\n}\n\n/** Háttéradatok: válaszadónként egy sor. */\nfunction writeBackground_(ss, base, p, code, now) {\n  var sh = sheet_(ss, base + ' · Background');\n  var d = p.durations || {};\n  var row = {\n    participant: code,\n    received: now,\n    participant_id: safe_(p.participantId),\n    lang: safe_(p.lang || ''),\n    config_version: safe_(p.configVersion || ''),\n    started_at: safe_(p.startedAt || ''),\n    submitted_at: safe_(p.submittedAt || ''),\n    presort_sec: num_(d.presortSec),\n    sort_sec: num_(d.sortSec),\n    total_min: d.totalSec ? Math.round(d.totalSec / 6) / 10 : '',\n    moves: num_(p.moves)\n  };\n  var ans = p.answers || {};\n  Object.keys(ans).forEach(function (k) {\n    var v = ans[k];\n    row['q_' + k] = safe_(Array.isArray(v) ? v.join('; ') : v);\n  });\n  appendByHeader_(sh, row);\n}\n\nfunction sheet_(ss, name) {\n  return ss.getSheetByName(name) || ss.insertSheet(name);\n}\n\nfunction appendByHeader_(sh, row) {\n  var lastCol = sh.getLastColumn();\n  var header = lastCol ? sh.getRange(1, 1, 1, lastCol).getValues()[0] : [];\n  var missing = Object.keys(row).filter(function (k) { return header.indexOf(k) < 0; });\n  if (missing.length) {\n    header = header.concat(missing);\n    sh.getRange(1, 1, 1, header.length).setValues([header]);\n    sh.setFrozenRows(1);\n  }\n  sh.appendRow(header.map(function (k) { return row.hasOwnProperty(k) ? row[k] : ''; }));\n}\n\nfunction sheetName_(id) {\n  return String(id).replace(/[^\\w\\-]/g, '_').slice(0, 80) || 'survey';\n}\n\n/** Képletbefecskendezés elleni védelem / guard against formula injection */\nfunction safe_(v) {\n  if (v === null || v === undefined) return '';\n  var s = String(v).slice(0, MAX_TEXT);\n  return /^[=+\\-@]/.test(s) ? \"'\" + s : s;\n}\n\nfunction num_(v) {\n  if (v === null || v === undefined || v === '') return '';\n  var n = Number(v);\n  return isFinite(n) ? n : '';\n}\n\nfunction json_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj))\n    .setMimeType(ContentService.MimeType.JSON);\n}\n";

  }
};

function suggestHeights(n, min, max, shape) {
  const k = max - min + 1;
  if (k < 3 || n < k) return null;
  const sig = { steep: k / 5.4, normal: k / 4.2, flat: k / 2.9 }[shape] || k / 4.2;
  const c = (k - 1) / 2;
  const w = Array.from({ length: k }, (_, i) => Math.exp(-((i - c) ** 2) / (2 * sig * sig)));
  const W = w.reduce((a, b) => a + b, 0);
  const hs = w.map(x => Math.max(1, Math.round(x / W * n)));
  const half = Math.floor(k / 2), odd = k % 2 === 1, mid = odd ? half : -1;
  for (let i = 0; i < half; i++) { const m = Math.max(1, Math.round((hs[i] + hs[k - 1 - i]) / 2)); hs[i] = hs[k - 1 - i] = m; }
  const sum = () => hs.reduce((a, b) => a + b, 0);
  const inner = i => i === half - 1 ? (odd ? hs[mid] : Infinity) : hs[i + 1];
  const outer = i => i === 0 ? 1 : hs[i - 1];
  let diff = n - sum(), guard = 0;
  while (diff !== 0 && guard++ < 2000) {
    if (Math.abs(diff) % 2 === 1) {
      const idx = odd ? mid : half;
      if (diff < 0 && hs[idx] <= 1) break;
      hs[idx] += Math.sign(diff);
    } else if (diff > 0) {
      let done = false;
      for (let i = half - 1; i >= 0; i--) { if (hs[i] + 1 <= inner(i)) { hs[i]++; hs[k - 1 - i]++; done = true; break; } }
      if (!done) { if (odd) hs[mid] += 2; else { hs[half - 1]++; hs[half]++; } }
    } else {
      let done = false;
      if (odd && hs[mid] - 2 >= hs[half - 1]) { hs[mid] -= 2; done = true; }
      if (!done) for (let i = half - 1; i >= 0; i--) { if (hs[i] > 1 && hs[i] - 1 >= outer(i)) { hs[i]--; hs[k - 1 - i]--; done = true; break; } }
      if (!done) break;
    }
    diff = n - sum();
  }
  // monotonicity repair (sum-preserving): heights must not decrease toward the centre
  for (let pass = 0; pass < 50; pass++) {
    let changed = false;
    if (odd && half >= 1 && hs[mid] < hs[half - 1] && hs[half - 1] > 1) { hs[mid] += 2; hs[half - 1]--; hs[half + 1]--; changed = true; }
    for (let i = half - 1; i >= 1; i--) {
      if (hs[i] < hs[i - 1]) { hs[i]++; hs[k - 1 - i]++; hs[i - 1]--; hs[k - i]--; changed = true; }
    }
    if (!changed) break;
  }
  return hs;
}

/* grid operations */
function locate(id) {
  const g = P.st.grid;
  for (let c = 0; c < g.length; c++) { const r = g[c].indexOf(id); if (r >= 0) return { c, r }; }
  return null;
}
function snap() { P.hist = P.hist || []; P.hist.push(JSON.stringify(P.st.grid)); if (P.hist.length > 100) P.hist.shift(); }
function unplaced() {
  const placed = new Set(P.st.grid.flat().filter(Boolean));
  return P.st.order.filter(id => !placed.has(id));
}
function sortQueue() {
  const rest = unplaced();
  return ['agree', 'disagree', 'neutral'].flatMap(p => rest.filter(id => (P.st.presort[id] || 'neutral') === p));
}
function currentId(q) {
  q = q || sortQueue();
  if (!q.length) return null;
  if (!P.cur || !q.includes(P.cur)) P.cur = q[0];
  return P.cur;
}
function placeAt(id, c, r) {
  const g = P.st.grid, from = locate(id), occ = g[c][r];
  if (occ === id) return;
  if (!from) P.cur = nextAfter(id);
  snap();
  if (from) g[from.c][from.r] = occ || null;
  g[c][r] = id;
  P.st.moves++; P.sel = null; saveP(); renderParticipant();
}
function placeInColumn(id, c) {
  const r = P.st.grid[c].indexOf(null);
  if (r < 0) { toast(t('col_full')); return; }
  placeAt(id, c, r);
}
function toTray(id) {
  const from = locate(id); if (!from) return;
  snap();
  P.st.grid[from.c][from.r] = null; P.st.moves++; P.sel = null; P.cur = id; saveP(); renderParticipant();
}
function undoSort() {
  if (!P.hist || !P.hist.length) return;
  const before = new Set(unplaced());
  P.st.grid = JSON.parse(P.hist.pop());
  const back = unplaced().find(id => !before.has(id));
  if (back) P.cur = back;
  P.sel = null; P.st.moves++; saveP(); renderParticipant();
}
function resetSort() {
  if (!confirm(t('s_reset_confirm'))) return;
  snap();
  P.st.grid = P.cfg.grid.heights.map(n => Array(n).fill(null));
  P.sel = null; P.cur = null; P.st.moves++; saveP(); renderParticipant();
}
function pileOf(id) { return P.st.presort[id] || 'neutral'; }
// next card after placing id: always from the earliest non-empty pile (agree, disagree, neutral)
function nextAfter(id) {
  const q = sortQueue(), rest = q.filter(x => x !== id);
  if (!rest.length) return null;
  const first = pileOf(rest[0]), inPile = rest.filter(x => pileOf(x) === first);
  if (pileOf(id) !== first) return inPile[0];
  const i = q.filter(x => pileOf(x) === first).indexOf(id);
  return inPile[Math.min(Math.max(i, 0), inPile.length - 1)];
}
function pileQueue(q) { const cur = currentId(q); return cur ? q.filter(x => pileOf(x) === pileOf(cur)) : []; }
function stepCur(d) {
  const q = sortQueue(), pq = pileQueue(q); if (pq.length < 2) return;
  const i = pq.indexOf(currentId(q));
  P.cur = pq[(i + d + pq.length) % pq.length]; P.sel = null; renderParticipant();
}
function shortId(id) { return /^S\d+$/.test(id) ? String(parseInt(id.slice(1), 10)) : id; }

function cardEl(id, extra) {

}

function fitSort() {
  const g = document.querySelector('.qgrid');
  if (!g || !P || P.st.stage !== 'sort') return;
  const rows = Math.max(1, ...P.cfg.grid.heights), gap = 4;
  let sh = P.sh || 40;
  if (window.innerWidth <= 700) sh = 46;
  else {
    for (let pass = 0; pass < 2; pass++) {
      const main = document.querySelector('main');
      const over = (main ? main.getBoundingClientRect().bottom + window.scrollY : document.documentElement.scrollHeight) - window.innerHeight;
      const total = rows * sh + (rows - 1) * gap;
      sh = Math.floor((total - over - 2 - (rows - 1) * gap) / rows);
      sh = Math.max(26, Math.min(sh, 96));
      g.style.setProperty('--sh', sh + 'px');
    }
  }
  const lc = sh >= 80 ? 4 : sh >= 62 ? 3 : sh >= 35 ? 2 : 1;
  P.sh = sh; P.lc = lc;
  g.style.setProperty('--sh', sh + 'px'); g.style.setProperty('--lc', String(lc));
}
window.addEventListener('resize', () => { clearTimeout(window.__fitT); window.__fitT = setTimeout(fitSort, 120); });

function extremeIds() {
  const { cfg, st } = P, k = cfg.grid.heights.length, d = Math.min(cfg.post.extremeDepth, Math.floor(k / 2));
  const right = [], leftSide = [];

    st.grid[k - 1 - i].forEach(id => id && right.push({ id, score: cfg.grid.max - i }));
    st.grid[i].forEach(id => id && leftSide.push({ id, score: cfg.grid.min + i }));
  }
  return { right, left: leftSide };
}

function payloadAnswers() {
  const { cfg, st } = P, out = Object.assign({}, st.answers);
  cfg.post.questions.forEach(q => {
    if (q.type !== 'multi') return;
    const a = Array.isArray(out[q.id]) ? out[q.id] : [];
    const res = a.filter(x => x !== '__other__');
    const txt = ((st.other || {})[q.id] || '').trim();
    if (a.includes('__other__') && txt) res.push((T[cfg.defaultLang] || T.hu).other_opt.replace(/[:：]\s*$/, '') + ': ' + txt);
    out[q.id] = res;
  });
  return out;
}
function buildPayload() {
  const { cfg, st } = P, tm = st.times, now = Date.now();
  const sort = {};
  st.grid.forEach((col, c) => col.forEach(id => { if (id) sort[id] = cfg.grid.min + c; }));
  const ex = cfg.post.extremeComments ? extremeIds() : { right: [], left: [] };
  const comments = {};
  [...ex.right, ...ex.left].forEach(({ id }) => { if ((st.comments[id] || '').trim()) comments[id] = st.comments[id].trim(); });
  const sec = (a, b) => (a && b) ? Math.round((b - a) / 1000) : null;
  return {
    format: 'q-muhely-response', surveyId: cfg.id, configVersion: P.ver, participantId: st.pid, lang: st.lang,
    startedAt: new Date(tm.start).toISOString(), submittedAt: new Date(now).toISOString(),
    durations: { presortSec: sec(tm.presortStart, tm.presortEnd), sortSec: sec(tm.sortStart, tm.sortEnd), totalSec: sec(tm.start, now) },
    moves: st.moves, grid: { min: cfg.grid.min, max: cfg.grid.max, heights: cfg.grid.heights },
    statementIds: cfg.statements.map(s => s.id), statementTexts: Object.fromEntries(cfg.statements.map(s => [s.id, s[cfg.defaultLang] || ''])), sort, presort: st.presort, comments, answers: payloadAnswers(),
    userAgent: navigator.userAgent
  };
}

async function submit() {
  const { cfg, st } = P;
  P.invalid = new Set();
  if (cfg.post.extremeComments && cfg.post.requireComments) {
    const ex = extremeIds();
    [...ex.right, ...ex.left].forEach(({ id }) => { if (!(st.comments[id] || '').trim()) P.invalid.add('c:' + id); });
  }
  cfg.post.questions.forEach(q => {
    if (q.type === 'multi') {
      const a = Array.isArray(st.answers[q.id]) ? st.answers[q.id] : [];
      const othBad = a.includes('__other__') && !((st.other || {})[q.id] || '').trim();
      if ((q.required && !a.length) || othBad) P.invalid.add('q:' + q.id);
    } else if (q.required && !String(st.answers[q.id] ?? '').trim()) P.invalid.add('q:' + q.id);
  });
  if (P.invalid.size) { P.error = 'invalid'; renderParticipant(); document.querySelector('.invalid')?.focus(); return; }
  P.error = null;
  if (P.preview) { st.times.submitted = Date.now(); P.lastPayload = buildPayload(); go('done'); return; }
  if (!cfg.endpoint) { P.error = 'noendpoint'; renderParticipant(); return; }
  P.sending = true; renderParticipant();
  try {
    const res = await fetch(cfg.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(buildPayload()) });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'failed');
    P.sending = false; st.times.submitted = Date.now(); go('done');
  } catch (e) {
    P.sending = false; P.error = 'send'; renderParticipant();
  }
}

function validate(c) {
  const out = { basics: [], texts: [], statements: [], grid: [], post: [], share: [] };
  const E = (tab, msg) => out[tab].push({ lvl: 'e', msg }), W = (tab, msg) => out[tab].push({ lvl: 'w', msg });
  if (!c.id) E('basics', t('v_id'));
  c.languages.forEach(l => {
    const U = l.toUpperCase();
    if (!(c.title[l] || '').trim()) W('basics', t('v_title', { l: U }));
    if (!(c.texts.instruction[l] || '').trim()) E('texts', t('v_coi', { l: U }));
    if (!(c.texts.intro[l] || '').trim()) W('texts', t('v_intro', { l: U }));
  });
  if (!c.endpoint) W('basics', t('v_endpoint'));
  const n = c.statements.length;
  if (!n) E('statements', t('v_nost'));
  else if (n < 20) W('statements', t('v_few', { n }));
  const seen = new Set();
  c.statements.forEach(s => {
    if (seen.has(s.id)) E('statements', t('v_dupid', { id: s.id })); seen.add(s.id);
    c.languages.forEach(l => { if (!(s[l] || '').trim()) E('statements', t('v_sttext', { id: s.id, l: l.toUpperCase() })); });
  });
  const long = c.statements.filter(s => c.languages.some(l => (s[l] || '').length > 200)).length;
  if (long) W('statements', t('v_long', { n: long }));
  const cells = c.grid.heights.reduce((a, b) => a + b, 0);
  if (cells !== n) E('grid', t('v_sum', { c: cells, n }));
  const hs = c.grid.heights;
  if (hs.some((x, i) => x !== hs[hs.length - 1 - i]) || c.grid.min !== -c.grid.max) W('grid', t('v_asym'));
  const qids = c.post.questions.map(q => q.id.trim());
  if (qids.some(x => !x) || new Set(qids).size !== qids.length) E('post', t('v_qid'));
  if (c.post.questions.some(q => (q.type === 'select' || q.type === 'multi') && !(q.options[c.defaultLang] || []).length)) E('post', t('v_opts'));
  return out;
}

    const s = n >= 2 * r + 1 ? suggestHeights(n, g.min, g.max, D.shape) : null;
    g.heights = s || Array.from({ length: 2 * r + 1 }, (_, i) => old[i] || 1);
    rerender();
  };
  return [
    h('h2', {}, t('tab_grid')), h('p', { class: 'intro' }, t('g_intro')),
    h('div', { class: 'row', style: 'margin-bottom:18px;gap:22px' },
      h('label', { class: 'small', style: 'font-weight:600' }, t('g_range'), ' ',
        h('select', { style: 'width:auto', onchange: e => setRange(parseInt(e.target.value, 10)) },
          [2, 3, 4, 5, 6].map(r => h('option', { value: r, selected: g.max === r && g.min === -r }, `${fmtScore(-r)} … ${fmtScore(r)}`)))),
      h('label', { class: 'small', style: 'font-weight:600' }, t('g_shape'), ' ',
        h('select', { style: 'width:auto', onchange: e => { D.shape = e.target.value; } },
          ['steep', 'normal', 'flat'].map(s => h('option', { value: s, selected: D.shape === s }, t('g_' + s))))),
      h('button', { class: 'btn ghost sm', disabled: n < k, onclick: () => { const s = suggestHeights(n, g.min, g.max, D.shape); if (s) { g.heights = s; rerender(); } } }, t('g_suggest'))),
    h('div', { class: 'lb', style: 'font-weight:600;font-size:14.5px' }, t('g_heights')),
    h('div', { class: 'hts' }, g.heights.map((x, i) => h('label', { style: scoreVars(g.min + i) },
      h('span', { style: 'color:var(--c)' }, fmtScore(g.min + i)),
      h('input', { type: 'number', min: 0, max: 30, value: x, 'aria-label': fmtScore(g.min + i), onchange: e => { g.heights[i] = Math.max(0, parseInt(e.target.value, 10) || 0); rerender(); } })))),
    h('span', { class: 'status ' + (cells === n ? 'ok' : 'bad') }, cells === n ? t('g_sum_ok', { c: cells, n }) : t('g_sum_bad', { c: cells, n, d: (cells > n ? '+' : '') + (cells - n) })),
    miniGridFor(c)
  ];
}
function miniGridFor(c) {
  return h('div', { class: 'mini', 'aria-hidden': 'true', style: 'margin-top:22px' }, c.grid.heights.map((n, i) => {
    const s = c.grid.min + i;
    return h('div', { class: 'mc', style: scoreVars(s) }, h('span', { class: 'ml' }, fmtScore(s)), Array.from({ length: n }, () => h('span', { class: 'mb' })));
  }));
}

function pPost() {
  const c = D.cfg, p = c.post;
  const qcards = p.questions.map((q, i) => h('div', { class: 'qcard' },
    h('div', { class: 'row', style: 'justify-content:space-between;margin-bottom:10px' },
      h('div', { class: 'row' },
        h('label', { class: 'small', style: 'font-weight:600' }, t('q_id'), ' ', h('input', { type: 'text', style: 'width:150px', value: q.id, onchange: e => { q.id = e.target.value.replace(/[^\w-]/g, '_'); rerender(); } })),
        h('label', { class: 'small', style: 'font-weight:600' }, t('q_type'), ' ', h('select', { style: 'width:auto', onchange: e => { q.type = e.target.value; rerender(); } },
          ['text', 'textarea', 'number', 'select', 'multi'].map(ty => h('option', { value: ty, selected: q.type === ty }, t('q_' + ty))))),
        h('label', { class: 'check small', style: 'font-weight:500' }, h('input', { type: 'checkbox', checked: q.required, onchange: e => { q.required = e.target.checked; persist(); } }), t('q_required'))),
      h('div', { class: 'row', style: 'gap:4px' },
        h('button', { class: 'icon-btn', 'aria-label': t('up'), disabled: i === 0, onclick: () => { [p.questions[i - 1], p.questions[i]] = [p.questions[i], p.questions[i - 1]]; rerender(); } }, '↑'),
        h('button', { class: 'icon-btn', 'aria-label': t('down'), disabled: i === p.questions.length - 1, onclick: () => { [p.questions[i + 1], p.questions[i]] = [p.questions[i], p.questions[i + 1]]; rerender(); } }, '↓'),
        h('button', { class: 'icon-btn', 'aria-label': t('del'), onclick: () => { p.questions.splice(i, 1); rerender(); } }, '✕'))),
    h('p', { class: 'help', style: 'margin:0 0 4px' }, t('q_label')), langInputs(q.label),
    q.type === 'multi' ? h('label', { class: 'check small', style: 'font-weight:500;margin-top:10px' }, h('input', { type: 'checkbox', checked: q.other, onchange: e => { q.other = e.target.checked; persist(); } }), t('q_other')) : null,
    q.type === 'select' || q.type === 'multi' ? [h('p', { class: 'help', style: 'margin:10px 0 4px' }, t('q_options')),
      c.languages.map(l => h('div', { class: 'lp' }, h('span', { class: 'ltag' }, l.toUpperCase()),
        h('textarea', { rows: 4, value: (q.options[l] || []).join('\n'), oninput: e => { q.options[l] = e.target.value.split('\n').map(x => x.trim()).filter(Boolean); persist(); } })))] : null));
  return [
    h('h2', {}, t('tab_post')), h('p', { class: 'intro' }, t('p_intro')),
    field('', null, h('label', { class: 'check', style: 'font-weight:500' }, h('input', { type: 'checkbox', checked: p.extremeComments, onchange: e => { p.extremeComments = e.target.checked; rerender(); } }), t('f_extreme'))),
    p.extremeComments ? [
      field(t('f_depth'), null, h('select', { style: 'max-width:320px', onchange: e => { p.extremeDepth = parseInt(e.target.value, 10); persist(); } },
        h('option', { value: 1, selected: p.extremeDepth === 1 }, t('depth1')), h('option', { value: 2, selected: p.extremeDepth === 2 }, t('depth2')))),
      field('', null, h('label', { class: 'check', style: 'font-weight:500' }, h('input', { type: 'checkbox', checked: p.requireComments, onchange: e => { p.requireComments = e.target.checked; persist(); } }), t('f_req_comments')))] : null,
    h('h3', { style: 'margin-top:30px' }, t('questions')),
    qcards,
    h('button', { class: 'btn ghost', onclick: () => { p.questions.push({ id: 'q' + (p.questions.length + 1), type: 'text', required: false, label: {}, options: {} }); rerender(); } }, t('add_q'))
  ];
}

function pShare(v) {
  const c = D.cfg;
  const all = TABS.flatMap(tab => v[tab].map(x => Object.assign({ tab }, x))).sort((a, b) => (a.lvl === 'e' ? 0 : 1) - (b.lvl === 'e' ? 0 : 1));
  const hasErr = all.some(x => x.lvl === 'e');
  const isWeb = /^https?:/.test(location.protocol);
  const fileInput = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none', onchange: async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const j = JSON.parse(await f.text()); if (!j.statements || !j.grid) throw 0; D.cfg = normalizeConfig(j); D.tab = 'share'; rerender(); dirtySinceSave = false; lastFileSave = Date.now(); }
    catch { alert(t('load_bad')); }
  } });
  const n = D.link ? D.link.length : 0;
  const lenMsg = !D.link ? null : n <= 8000 ? h('span', { class: 'lenmsg ok' }, t('len_ok', { n })) : h('span', { class: 'lenmsg bad' }, t('len_bad', { n }));
  const shorteners = [['TinyURL', 'https://tinyurl.com/']];
  const guide = GUIDE[uiLang] || GUIDE.hu;
  return [
    h('h2', {}, t('tab_share')), h('p', { class: 'intro' }, t('sh_intro')),
    h('ul', { class: 'vlist' }, all.length ? all.map(x => h('li', { class: x.lvl }, x.msg, ' ',
      h('button', { class: 'btn link small', onclick: () => { D.tab = x.tab; renderDesigner(); } }, t('tab_' + x.tab)))) : h('li', { class: 'o' }, t('v_ok'))),
    h('div', { class: 'row', style: 'margin-bottom:34px' },
      h('button', { class: 'btn', disabled: !c.statements.length || c.grid.heights.reduce((a, b) => a + b, 0) !== c.statements.length,
        onclick: () => startParticipant(c, { preview: true }) }, t('preview')),
      h('button', { class: 'btn ghost', onclick: saveToFile }, t('dl_cfg')),
      h('button', { class: 'btn ghost', onclick: () => fileInput.click() }, t('load_cfg')), fileInput),

    h('h3', {}, t('link_t')),
    h('p', { class: 'help', style: 'max-width:68ch' }, t('link_help')),
    !isWeb ? h('p', { class: 'err small' }, t('link_file_warn')) : null,
    h('div', { class: 'row', style: 'margin-bottom:12px' },
      h('button', { class: 'btn', disabled: hasErr, onclick: async () => { D.link = D.base + '#c=' + await packConfig(c); renderDesigner(); } }, t('link_make'))),
    D.link ? [h('textarea', { class: 'linkbox', readonly: true, value: D.link, 'aria-label': t('link_t') }),
      lenMsg,
      h('div', { class: 'row', style: 'margin:12px 0 0' },
        h('button', { class: 'btn sm', onclick: () => copyText(D.link) }, t('copy')),
        h('a', { class: 'btn ghost sm', href: D.link, target: '_blank', rel: 'noopener' }, t('open'))),
      h('div', { class: 'row', style: 'margin:14px 0 0' },
        h('span', { class: 'small', style: 'font-weight:600' }, t('short_t')),
        shorteners.map(([nm, url]) => h('a', { class: 'btn ghost sm', href: url, target: '_blank', rel: 'noopener noreferrer' }, nm + ' ↗')),
        h('span', { class: 'muted small' }, t('short_help')))] : null,

    h('h3', { style: 'margin-top:36px' }, t('gs_t')),
    h('p', { class: 'help', style: 'max-width:68ch' }, t('gs_help')),
    !c.endpoint ? h('p', { class: 'gs-notice' }, t('gs_notice')) : null,
    h('details', { class: 'box' }, h('summary', {}, t('gs_guide_t')),
      guide.filter(([k]) => k === 'note').map(([, x]) => h('p', { class: 'guide-note' }, h('strong', {}, t('gs_note_t') + ': '), x)),
      h('ol', { class: 'guide' }, guide.filter(([k]) => k === 's' || k === 'w').map(([k, x]) => h('li', { class: k === 'w' ? 'w' : null }, x))),
      h('p', { style: 'font-weight:600;margin:12px 0 6px' }, t('gs_trouble')),
      guide.filter(([k]) => k === 't').map(([, x]) => h('p', { class: 'help', style: 'font-size:14.5px' }, x))),
    APPS_SCRIPT ? h('details', { class: 'box' }, h('summary', {}, t('gs_code_t')),
      h('button', { class: 'btn ghost sm', style: 'margin:12px 0 10px', onclick: () => copyText(APPS_SCRIPT) }, t('copy_code')),
      h('pre', { class: 'code' }, APPS_SCRIPT)) : null
  ];
}

/* ---------- home ---------- */
function renderHome() {
  document.body.classList.remove('dmode');
  mode = 'home';
  document.documentElement.lang = uiLang;
  document.title = t('appName');
  const hs = [2, 3, 4, 5, 6, 5, 4, 3, 2];
  let d = 0;
  const pyr = h('div', { class: 'pyr anim', 'aria-hidden': 'true' }, hs.map((n, i) => {
    const s = i - 4;
    return h('div', { class: 'pc', style: scoreVars(s) }, h('span', { class: 'pl', style: 'color:var(--c)' }, fmtScore(s)),
      Array.from({ length: n }, () => h('span', { class: 'pb', style: `--d:${(d++) * 22}ms` })));
  }));
  mount(
    h('header', { class: 'bar' }, h('div', { class: 'brand', style: 'cursor:default' }, brandMark(), t('appName')), langSwitch(LANGS, uiLang, l => { setUiLang(l); renderHome(); })),
    h('main', { class: 'wrap' },
      h('section', { class: 'hero' },
        h('div', {},
          h('h1', {}, t('appName')),
          h('p', { class: 'lead' }, t('home_lead')),
          h('div', { class: 'hero-actions' },
            h('button', { class: 'btn', onclick: startDesigner }, t('home_design')),
            h('button', { class: 'btn ghost', onclick: () => startParticipant(DEMO, { preview: true, from: 'home' }) }, t('home_demo'))),
          h('p', { class: 'muted small' }, t('home_note'))),
        pyr),
      h('section', { class: 'feat' }, [1, 2, 3].map(i => h('div', {}, h('h3', {}, t('f' + i + 't')), h('p', {}, t('f' + i)))))));
}

function renderLoadError() {
  document.body.classList.remove('dmode');
  mode = 'error';
  mount(h('header', { class: 'bar' }, h('div', { class: 'brand' }, brandMark(), t('appName'))),
    h('main', { class: 'wrap narrow' }, h('h1', {}, t('load_err_t')), h('p', {}, t('load_err'))));
}

/* ---------- routing ---------- */
async function boot() {
  const hsh = location.hash, qs = new URLSearchParams(location.search);
  try {
    if (hsh.startsWith('#c=')) return startParticipant(await unpackConfig(hsh.slice(3)));
    const s = qs.get('s');
    if (s) {
      const r = await fetch('surveys/' + s.replace(/[^\w-]/g, '') + '.json', { cache: 'no-store' });
      if (!r.ok) throw new Error('not found');
      return startParticipant(await r.json());
    }
  } catch (e) { return renderLoadError(); }
  if (hsh === '#tervezo' || hsh === '#designer') return startDesigner();
  renderHome();
}
boot();

</script>
